<style>
:root{--bg:#000;--bg2:#080808;--bg3:#0a0a0a;--card:#0d0d0d;--border:#1a1a1a;--border2:#252525;--accent:#2563eb;--al:#3b82f6;--ag:rgba(37,99,235,.25);--text:#f0f4ff;--muted:#475569;--muted2:#64748b;--mono:'JetBrains Mono',monospace;--sans:'Syne',sans-serif;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--purple:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
.page{display:none;min-height:100vh;padding-bottom:80px}.page.active{display:block}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(0,0,0,.92);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;height:64px}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:all .2s;border:none;background:none;color:var(--muted);font-family:var(--sans);font-size:9px;font-weight:600;letter-spacing:.3px;padding:0 2px}
.nav-item svg{width:18px;height:18px;transition:all .2s}.nav-item.active{color:var(--al)}.nav-item.active svg{filter:drop-shadow(0 0 6px var(--al))}
.page-header{padding:48px 20px 20px;display:flex;align-items:flex-start;justify-content:space-between;max-width:480px;margin:0 auto}
.page-header h1{font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1.1}.page-header p{font-size:11px;color:var(--muted2);margin-top:4px;font-family:var(--mono)}
.xp-badge{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;background:linear-gradient(135deg,#1e3a5f,var(--accent));font-size:11px;font-weight:700;color:#fff;border:1px solid var(--al);font-family:var(--mono);white-space:nowrap;flex-shrink:0;box-shadow:0 0 20px var(--ag)}
.star{width:11px;height:11px;background:#fbbf24;flex-shrink:0;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.prog-wrap{max-width:480px;margin:0 auto;padding:0 20px 20px}.prog-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted2);margin-bottom:7px;font-family:var(--mono)}.prog-meta span:last-child{color:var(--al)}
.prog-track{height:8px;background:var(--bg3);border-radius:99px;overflow:hidden;border:1px solid var(--border)}.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#1e40af,var(--al),#bfdbfe);transition:width .8s cubic-bezier(.4,0,.2,1)}
.section-sep{display:flex;align-items:center;gap:10px;font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;font-family:var(--mono)}.section-sep::after{content:'';flex:1;height:1px;background:var(--border)}.sep-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.btn-main{width:100%;padding:13px;border-radius:12px;cursor:pointer;border:1px solid var(--accent);background:linear-gradient(135deg,#1e3a5f,var(--accent));color:#fff;font-size:13px;font-weight:700;font-family:var(--sans);transition:opacity .15s,transform .15s;letter-spacing:.3px;display:block;text-align:center}.btn-main:hover{opacity:.9;transform:translateY(-1px)}.btn-main:disabled{opacity:.3;cursor:not-allowed;transform:none}
.btn-ghost{width:100%;padding:12px;border-radius:12px;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--muted2);font-size:13px;font-weight:600;font-family:var(--sans);transition:all .15s;display:block;text-align:center}.btn-ghost:hover{color:var(--text)}.btn-ghost:disabled{opacity:.25;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;overflow:hidden}
/* ... resto do CSS igual ... */
</style>
</head>

// ══ ESTEQUIOMETRIA ══
function getEstequiometriaDid(){return `
<div class="card">
  <div class="did-label">O que é Estequiometria?</div>
  <div class="did-intro">É o cálculo das quantidades de reagentes e produtos em uma reação química, baseado na Lei da Conservação da Massa.</div>
</div>

<div class="card">
  <div class="did-label">1. Equação Balanceada</div>
  <div class="did-step">
    <div class="step-n">1</div>
    <div class="step-c">
      <h4>Por que balancear?</h4>
      <p>Para respeitar a conservação da massa: massa dos reagentes = massa dos produtos.</p>
      <div class="formula">Exemplo: 2H₂ + O₂ → 2H₂O</div>
    </div>
  </div>
</div>

<div class="card">
  <div class="did-label">2. Conceitos Básicos</div>
  <div class="did-step">
    <div class="step-n">2</div>
    <div class="step-c">
      <h4>Fórmulas importantes</h4>
      <p><strong>n = m / M</strong> (quantidade de matéria)</p>
      <p><strong>M</strong> = massa molar (g/mol)</p>
    </div>
  </div>
</div>

<div class="card">
  <div class="did-label">3. Cálculo Estequiométrico</div>
  <div class="did-step">
    <div class="step-n">3</div>
    <div class="step-c">
      <h4>Passo a passo</h4>
      <p>1. Balancear a equação<br>
         2. Calcular massas molares<br>
         3. Converter massa → mol<br>
         4. Usar proporção da equação<br>
         5. Converter mol → massa</p>
    </div>
  </div>
</div>

<div class="card">
  <div class="did-label">4. Reagente Limitante</div>
  <div class="did-step">
    <div class="step-n">4</div>
    <div class="step-c">
      <h4>Importante!</h4>
      <p>É o reagente que se esgota primeiro e limita a quantidade de produto formado.</p>
    </div>
  </div>
</div>
`;}

function getEstequiometriaQuest(){return [
  {q:'Qual é a massa molar da água (H₂O)?',opts:['16 g/mol','18 g/mol','20 g/mol','36 g/mol'],c:1,
   res:'<strong>18 g/mol.</strong> (2×1 + 16 = 18)'},
  {q:'Na reação 2H₂ + O₂ → 2H₂O, quantos moles de O₂ são necessários para reagir com 4 moles de H₂?',opts:['1 mol','2 mol','4 mol','8 mol'],c:1,
   res:'<strong>2 moles de O₂.</strong> Proporção: 2 H₂ : 1 O₂ → 4 H₂ : 2 O₂'},
  {q:'Quantos gramas de água são produzidos a partir de 8g de H₂ (reação completa)?',opts:['18g','36g','72g','9g'],c:2,
   res:'<strong>72g de H₂O.</strong><br>8g H₂ = 4 mol → produzem 4 mol H₂O = 72g'},
  {q:'O que é reagente limitante?',opts:['Reagente em excesso','Reagente que se esgota primeiro','Produto da reação','Catalisador'],c:1,
   res:'<strong>O reagente que se esgota primeiro.</strong> Ele determina a quantidade máxima de produto.'},
  {q:'Qual lei fundamenta a estequiometria?',opts:['Lei de Boyle','Lei de Charles','Lei da Conservação da Massa','Lei de Proust'],c:2,
   res:'<strong>Lei da Conservação da Massa (Lavoisier).</strong> Nada se cria, nada se perde, tudo se transforma.'}
];}
